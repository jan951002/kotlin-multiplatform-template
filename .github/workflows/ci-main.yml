name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      has-gradle: ${{ steps.check-gradle.outputs.has-gradle }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for Gradle project
        id: check-gradle
        run: |
          if [ -f "gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "has-gradle=true" >> $GITHUB_OUTPUT
            echo "✅ Gradle project detected"
          else
            echo "has-gradle=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No Gradle project detected - skipping Gradle-specific validations"
            echo "   This is normal for project templates in early stages"
          fi

      - name: Validate Gradle wrapper
        if: steps.check-gradle.outputs.has-gradle == 'true'
        uses: gradle/wrapper-validation-action@v1

      - name: Template validation
        if: steps.check-gradle.outputs.has-gradle == 'false'
        run: |
          echo "🏗️  Validating project template structure..."
          
          # Check for basic template files
          if [ ! -f "README.md" ]; then
            echo "❌ README.md is required"
            exit 1
          fi
          
          if [ ! -f "LICENSE" ]; then
            echo "❌ LICENSE file is required"
            exit 1
          fi
          
          echo "✅ Template structure validation passed"

  lint:
    name: Code Style & Lint
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.has-gradle == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Ktlint
        run: ./gradlew ktlintCheck

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Upload Detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/detekt.html'

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.has-gradle == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Common Tests
        run: ./gradlew :shared:testDebugUnitTest

      - name: Run Android Tests
        run: ./gradlew :androidApp:testDebugUnitTest

      - name: Generate Test Report
        run: ./gradlew jacocoTestReport

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/jacoco/

      - name: Comment PR with Coverage
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: |
            ${{ github.workspace }}/**/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 70
          min-coverage-changed-files: 70

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [validate, lint, test]
    if: needs.validate.outputs.has-gradle == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: [validate, lint, test]
    if: needs.validate.outputs.has-gradle == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Shared Framework
        run: ./gradlew :shared:assembleXCFramework

      - name: Build iOS App
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
                     -scheme iosApp \
                     -destination 'platform=iOS Simulator,name=iPhone 15' \
                     -configuration Debug \
                     build

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.has-gradle == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Dependency Check
        run: ./gradlew dependencyCheckAnalyze

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: '**/build/reports/dependency-check-report.html'

  success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [validate, lint, test, build-android, build-ios, security-scan]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "🔍 Checking CI pipeline results..."
          
          # Check validation job (always runs)
          if [[ "${{ needs.validate.result }}" == "failure" ]]; then
            echo "❌ Validation failed"
            exit 1
          fi
          
          # Check Gradle-dependent jobs (only if they ran)
          gradle_jobs=("lint" "test" "build-android" "build-ios" "security-scan")
          for job in "${gradle_jobs[@]}"; do
            result=""
            case $job in
              "lint") result="${{ needs.lint.result }}" ;;
              "test") result="${{ needs.test.result }}" ;;
              "build-android") result="${{ needs.build-android.result }}" ;;
              "build-ios") result="${{ needs.build-ios.result }}" ;;
              "security-scan") result="${{ needs.security-scan.result }}" ;;
            esac
            
            if [[ "$result" == "failure" ]]; then
              echo "❌ $job failed"
              exit 1
            elif [[ "$result" == "success" ]]; then
              echo "✅ $job passed"
            elif [[ "$result" == "skipped" ]]; then
              echo "⏭️  $job skipped (no Gradle project)"
            fi
          done
          
          echo ""
          if [[ "${{ needs.validate.outputs.has-gradle }}" == "true" ]]; then
            echo "🎉 All Gradle project CI checks passed successfully!"
          else
            echo "🎉 Template validation completed successfully!"
            echo "ℹ️  Gradle-specific checks were skipped (normal for project templates)"
          fi